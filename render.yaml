services:
  # Backend Web Service
  - type: web
    name: mailcraft-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mailcraft-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: mailcraft-frontend
          property: host

  # Frontend Static Site
  - type: web
    name: mailcraft-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mailcraft-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: mailcraft-postgres
    plan: free
    databaseName: mailcraft_db
    user: mailcraft_user
